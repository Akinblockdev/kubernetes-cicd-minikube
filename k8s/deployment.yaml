apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-day30-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-day30
  template:
    metadata:
      labels:
        app: devops-day30
    spec:
      containers:
        - name: nodejs-app
          image: devops-day30-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
